<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 견적서 PDF용: 윈도우 글꼴(굴림·돋움·맑은 고딕)이 없는 서버에서 나눔고딕으로 바꿔 그림 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>굴림</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
  <match target="pattern"><test name="family"><string>굴림체</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
  <match target="pattern"><test name="family"><string>돋움</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
  <match target="pattern"><test name="family"><string>돋움체</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
  <match target="pattern"><test name="family"><string>맑은 고딕</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
  <match target="pattern"><test name="family"><string>Malgun Gothic</string></test><edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit></match>
</fontconfig>
