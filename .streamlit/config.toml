# 디자인: "slate" 다크 엔터프라이즈 (2026-11-06 사용자 명세서). 색 값은 ui_style.py THEMES["slate"]와 같게 유지한다.
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
linkColor = "#818CF8"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, Noto Sans KR, Malgun Gothic, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "10px"
borderColor = "#334155"
showWidgetBorder = true
dataframeBorderColor = "#283548"
dataframeHeaderBackgroundColor = "#090D16"
dataframeHeaderTextColor = "#94A3B8"
greenColor = "#10B981"
redColor = "#F87171"
orangeColor = "#F59E0B"
blueColor = "#3B82F6"

[theme.sidebar]
backgroundColor = "#090D16"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
primaryColor = "#818CF8"
borderColor = "#1E293B"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20
# 화면보호기·절전으로 연결이 끊겨도 12시간 동안은 같은 세션(입력 중인 값 포함)으로 다시 이어짐
disconnectedSessionTTL = 43200
