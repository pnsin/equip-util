# 디자인: "soft" 말랑한 업무툴 (2026-11-06 전체 통일). 색 값은 ui_style.py THEMES["soft"]와 같게 유지한다.
[theme]
base = "light"
primaryColor = "#5B6CFF"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#F3F4FA"
textColor = "#1E2433"
linkColor = "#4B5BEA"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, Noto Sans KR, Malgun Gothic, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "10px"
borderColor = "#D5DAE6"
showWidgetBorder = true
dataframeBorderColor = "#CBD3E1"
dataframeHeaderBackgroundColor = "#E6EBF5"
dataframeHeaderTextColor = "#1E2433"
greenColor = "#1A9A6C"
redColor = "#E5484D"
orangeColor = "#D98B1E"
blueColor = "#5B6CFF"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4FA"
textColor = "#1E2433"
primaryColor = "#5B6CFF"
borderColor = "#E6E9F2"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20
# 화면보호기·절전으로 연결이 끊겨도 12시간 동안은 같은 세션(입력 중인 값 포함)으로 다시 이어짐
disconnectedSessionTTL = 43200
