# 디자인: "navy" 남색 메뉴 + 밝은 본문 (2026-11-02 사용자 선택). 색 값은 ui_style.py THEMES["navy"]와 같게 유지한다.
[theme]
base = "light"
primaryColor = "#2563C9"
backgroundColor = "#F2F4F7"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1B2430"
linkColor = "#2563C9"
font = "IBM Plex Sans KR:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap, Noto Sans KR, Malgun Gothic, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "small"
borderColor = "#C8D0DA"
showWidgetBorder = true
dataframeBorderColor = "#E1E5EB"
dataframeHeaderBackgroundColor = "#F7F8FA"
dataframeHeaderTextColor = "#5A6474"
greenColor = "#1E8E5A"
redColor = "#C9372C"
orangeColor = "#B5650B"
blueColor = "#2563C9"

[theme.sidebar]
backgroundColor = "#132036"
secondaryBackgroundColor = "#1B2B45"
textColor = "#E4EAF2"
primaryColor = "#7FB0FF"
borderColor = "#22324D"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20
# 화면보호기·절전으로 연결이 끊겨도 12시간 동안은 같은 세션(입력 중인 값 포함)으로 다시 이어짐
disconnectedSessionTTL = 43200
