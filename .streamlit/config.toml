# 디자인: "paper" 따뜻한 종이 + 테라코타 (2026-11-23 사용자 지시서 'Warm Editorial Light'). 색 값은 ui_style.py THEMES["paper"]와 같게 유지한다.
[theme]
base = "light"
primaryColor = "#D97757"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#191918"
linkColor = "#C26344"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, Noto Sans KR, Malgun Gothic, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "10px"
borderColor = "#E8E6DF"
showWidgetBorder = true
dataframeBorderColor = "#EAE7DF"
dataframeHeaderBackgroundColor = "#F2EFE9"
dataframeHeaderTextColor = "#6B6860"
greenColor = "#4A6B5D"
redColor = "#C84B31"
orangeColor = "#D4A359"
blueColor = "#3B6EA8"

[theme.sidebar]
backgroundColor = "#F5F3EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#191918"
primaryColor = "#D97757"
borderColor = "#E8E6DF"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20
# 화면보호기·절전으로 연결이 끊겨도 12시간 동안은 같은 세션(입력 중인 값 포함)으로 다시 이어짐
disconnectedSessionTTL = 43200
# static/ 폴더(로고) 를 주소로 내보냄: 화면마다 그림을 글자로 다시 보내지 않게
enableStaticServing = true
